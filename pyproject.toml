[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iupac-scan"
version = "1.0.0"
description = "Bit-parallel scanning of degenerate IUPAC DNA motifs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bert Mouler" }]
keywords = ["bioinformatics", "DNA", "IUPAC", "motif"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "mypy>=1.14",
  "mutmut>=3.7",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
iupac-scan = "iupac_scan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iupac_scan"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["iupac_scan"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.mutmut]
source_paths = ["src/iupac_scan"]
